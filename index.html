<script>
document.addEventListener("DOMContentLoaded", () => {

    const iframe =
        document.querySelector(
            'iframe[name="hlavny-ramec"]'
        );

    if (!iframe) return;


    // ==========================================
    // MENU → HASH
    // ==========================================

    document
        .querySelectorAll(".menu-btn[data-route]")
        .forEach(link => {

            link.addEventListener("click", () => {

                const route =
                    link.dataset.route;

                history.pushState(
                    null,
                    "",
                    route
                );

            });

        });


    // ==========================================
    // PRIAMY ODKAZ
    // ==========================================

    const routes = {

        "#/home":
            "home.html",

        "#/skola":
            "skola.html",

        "#/songs":
            "songs.html",

        "#/guitarsystem":
            "guitarsystem.html",

        "#/db_akordov":
            "db_akordov.html",

        "#/akordy":
            "akordy.html",


        "#/hmatnik":
            "gitara-pro.html",

        "#/stupnice":
            "stupnice.html",

        "#/intervaly":
            "intervals_chords.html",

        "#/cvicenia":
            "lefthand.html",

        "#/notypiesni":
            "noty_piesni.html",

        "#/cvicenia":
            "lefthand.html",


        "#/rozcvicka":
            "exercises.html",

        "#/prava-ruka":
            "right1.html"

    };


    // ==========================================
    // PRIAME OTVORENIE index.html#/...
    // ==========================================

   function loadFromHash() {

    const hash =
        window.location.hash;

    // GUITAR SYSTEM: preserve deep route
    if (hash.startsWith("#/guitarsystem/")) {

        const guitarRoute =
            hash.substring(1);

        iframe.src =
            "guitarsystem.html#" +
            guitarRoute;

        return;

    }

    // SONGS: preserve deep route
    if (hash.startsWith("#/songs/")) {

        const songRoute =
            hash.substring(1);

        iframe.src =
            "songs.html#" +
            songRoute;

        return;

    }

    const page =
        routes[hash];

    if (!page) return;

    if (
        iframe.getAttribute("src") !== page
    ) {

        iframe.src = page;

    }

}


    loadFromHash();

    window.addEventListener(
    "popstate",
    loadFromHash
);

window.addEventListener(
    "hashchange",
    loadFromHash
);

});
</script>

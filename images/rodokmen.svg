<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; font-family: Arial, sans-serif;">
  
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="400" y="30" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Prehľad a odvodenie bežne používaných akordov (od tónu C)</text>

  <rect x="340" y="60" width="120" height="50" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="82" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">C dur (C)</text>
  <text x="400" y="100" font-size="11" fill="#0284c7" text-anchor="middle">C - E - G</text>


  <path d="M 340,85 L 170,85 L 170,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="235" y="78" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">znížená 3. (Es)</text>

  <path d="M 400,110 L 400,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="405" y="128" font-size="10" font-weight="bold" fill="#475569" text-anchor="left">+ m.7 (B)</text>

  <path d="M 460,85 L 630,85 L 630,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="565" y="78" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">+ v.6 (A)</text>

  <rect x="110" y="140" width="120" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="170" y="162" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">C mol (Cmi)</text>
  <text x="170" y="180" font-size="11" fill="#475569" text-anchor="middle">C - Es - G</text>

  <rect x="340" y="140" width="120" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="162" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">Dominantný (C7)</text>
  <text x="400" y="180" font-size="11" fill="#b45309" text-anchor="middle">C - E - G - B</text>

  <rect x="570" y="140" width="120" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="162" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">C dur s 6 (C6)</text>
  <text x="630" y="180" font-size="11" fill="#15803d" text-anchor="middle">C - E - G - A</text>


  <path d="M 170,190 L 110,190 L 110,240" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="105" y="218" font-size="10" font-weight="bold" fill="#475569" text-anchor="end">+ m.7 (B)</text>

  <path d="M 170,190 L 230,190 L 230,240" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="235" y="218" font-size="10" font-weight="bold" fill="#475569" text-anchor="start">+ v.6 (A)</text>

  <path d="M 400,190 L 400,240" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="405" y="218" font-size="10" font-weight="bold" fill="#475569" text-anchor="start">3. zamenená za 4. (F)</text>

  <path d="M 110,290 L 110,340" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="105" y="318" font-size="10" font-weight="bold" fill="#475569" text-anchor="end">znížená 5. (Ges)</text>

  <path d="M 170,365 L 340,365" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="255" y="358" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">znížená m.7 na zm.7 (Heses)</text>


  <rect x="50" y="240" width="120" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="262" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">C mol 7 (Cmi7)</text>
  <text x="110" y="280" font-size="11" fill="#475569" text-anchor="middle">C - Es - G - B</text>

  <rect x="170" y="240" width="120" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="262" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">C mol 6 (Cmi6)</text>
  <text x="230" y="280" font-size="11" fill="#475569" text-anchor="middle">C - Es - G - A</text>

  <rect x="340" y="240" width="120" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="262" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">S kvartou (C7/4)</text>
  <text x="400" y="280" font-size="11" fill="#b45309" text-anchor="middle">C - F - G - B</text>

  <rect x="50" y="340" width="120" height="50" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="110" y="362" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Polozmenš. (Cø)</text>
  <text x="110" y="380" font-size="10" fill="#cbd5e1" color="#b91c1c" text-anchor="middle">C - Es - Ges - B</text>

  <rect x="340" y="340" width="120" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="362" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Zmenšený (Cdim)</text>
  <text x="400" y="380" font-size="10" fill="#b91c1c" text-anchor="middle">C - Es - Ges - Heses</text>

</svg>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guitar Learning System</title>
<link rel="stylesheet" href="css/style_gs.css">

</head>
<body>

<div class="container">

    <div class="topPanel">

        <h2>Guitar Learning System</h2>

        <div class="controls">

            <select id="categorySelect"></select>

            <select id="itemSelect"></select>

            <div id="groupFilter">
    <select id="groupSelect"></select>
</div>

<div id="qualityFilter">
    <select id="qualitySelect"></select>
</div>

        <button id="previousButton">&#9664;</button>

        <button id="nextButton">&#9654;</button>          
        <button id="autoplayButton">
    Play - Stop
</button>

        </div>

        <div class="infoBox">

            <div id="title"></div>

            <div id="description"></div>

            <div id="extraInfo"></div>

        </div>

        <div class="speedBox">

            Rýchlosť:
            <span id="speedValue">80 BPM</span>

            <br><br>

            <input
                 id="speedSlider"
            type="range"
            min="40"
             max="440"
             value="80">
            >

        </div>

    </div>

    <div id="renderPanel">

    <div id="fretboardWrap">

        <svg id="fretboard"
             viewBox="0 0 1200 420">
        </svg>
    
    </div>

    <div id="notationWrap">

        <div id="notation"></div>

    </div>

    <div id="tabWrap">

        <div id="tab"></div>

    </div>
<!--
    <div data-render="exercise" data-item="cvic12"></div>

<div id="lesson"></div>
-->
</div>

</div>

<!-- Core -->

   <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  
 
<script src="js/bootstrap/Manifest.js"></script>
<script src="js/bootstrap/Loader.js"></script>

<script>

(async () => {

    await Loader.loadModules(Manifest);

    const app = await App.start();

    await app.lessonLoader.open(

        "lesson01",

        document.getElementById("lesson")

    );

})();

</script>

</body>
</html>

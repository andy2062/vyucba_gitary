<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Databáza akordov</title>
<link rel="stylesheet" href="css/db_akordov.css">

</head>

<body>
  Vysvetlenie zloženia akordov nájdete v časti <a href="index.html#/intervaly" target="_parent">Intervaly</a>.
<h1>Databáza akordov</h1>

<input type="text" id="search" placeholder="Hľadaj akord...">
<h2 id="chordTitle">Vyber akord</h2>
<!-- ZOZNAM AKORDOV -->
<div id="chordList"></div>

<!-- 🔥 VEĽKÝ AKORD POD ZOZNAMOM -->
<div id="akord" style="margin-top:30px;">
  
  

  <svg width="200" height="220">
    <g id="frets"></g>
    <g id="strings"></g>
    <g id="dots"></g>
  </svg>
<div id="chordNav"></div>
</div>

<script src="./js/novy_chord1.js"></script>

<script>

// ===============================
// 🎸 RENDER LIST
// ===============================
function renderChordList() {

  if (!chordsLoaded) return;

  const list = document.getElementById("chordList");
  list.innerHTML = "";

  const names = Object.keys(chordsDB).sort();

  names.forEach(name => {

    const btn = document.createElement("button");
    btn.className = "chordBtn";
    btn.textContent = name;

    btn.onclick = () => showChord(name);

    list.appendChild(btn);
  });
}

// GLOBAL
window.renderChordList = renderChordList;

document.getElementById("search").addEventListener("input", e => {

  const value = e.target.value.toLowerCase();

  document.querySelectorAll(".chordBtn").forEach(btn => {
    btn.style.display = btn.textContent.toLowerCase().includes(value)
      ? "inline-block"
      : "none";
  });

});
// ===============================
// INIT
// ===============================

setTimeout(renderChordList, 200);

</script>

</body>
</html>

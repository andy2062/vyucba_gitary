<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Gitarový Generátor - Názvy strún</title>
    <style>
        .guitar-container { margin: 20px; font-family: sans-serif; }
        svg { background: #fff; border: 1px solid #eee; display: block; border-radius: 8px; }
        .controls { margin-bottom: 15px; }
        button { padding: 8px 15px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; }
        button:hover { background: #e0e0e0; }
    </style>
</head>
<body>

<div class="guitar-container">
    <div class="controls">
        <button onclick="drawScale('E_DUR')">E-Dur Stupnica</button>
        <button onclick="drawScale('C_DUR_AKORD')">C-Dur Akord</button>
    </div>
    <div id="fretboard"></div>
</div>

<script>
const cfg = {
    width: 750,
    height: 220,
    strings: 6,
    frets: 7,
    startX: 70, // Zväčšený okraj, aby sa zmestili názvy strún
    startY: 40,
    fretWidth: 70,
    stringGap: 28,
    dotRadius: 11,
    // Názvy strún od najtenšej (hore) po najhrubšiu (dole)
    stringNames: ['e', 'h', 'G', 'D', 'A', 'E']
};

function renderGuitar(notes) {
    const fretboard = document.getElementById('fretboard');
    let svg = `<svg width="${cfg.width}" height="${cfg.height}" viewBox="0 0 ${cfg.width} ${cfg.height}">`;
    
    // 1. Vykreslenie Názvov strún (vľavo od hmatníka)
    for (let i = 0; i < cfg.strings; i++) {
        let y = cfg.startY + (i * cfg.stringGap);
        svg += `<text x="${cfg.startX - 45}" y="${y}" 
                      fill="#888" font-size="16" font-family="Georgia, serif" 
                      font-style="italic" dominant-baseline="central">${cfg.stringNames[i]}</text>`;
    }

    // 2. Vykreslenie pražcov
    for (let i = 0; i <= cfg.frets; i++) {
        let x = cfg.startX + (i * cfg.fretWidth);
        let strokeW = (i === 0) ? 6 : 2; // Nut je poriadne hrubý
        svg += `<line x1="${x}" y1="${cfg.startY}" x2="${x}" y2="${cfg.startY + (cfg.strings - 1) * cfg.stringGap}" stroke="#333" stroke-width="${strokeW}" />`;
    }

    // 3. Vykreslenie strún
    for (let i = 0; i < cfg.strings; i++) {
        let y = cfg.startY + (i * cfg.stringGap);
        let thickness = 1 + (i * 0.6); 
        svg += `<line x1="${cfg.startX}" y1="${y}" x2="${cfg.startX + (cfg.frets * cfg.fretWidth)}" y2="${y}" stroke="#444" stroke-width="${thickness}" />`;
    }

    // 4. Vykreslenie tónov, farieb a prstov
    notes.forEach(note => {
        let stringIdx = note[0] - 1;
        let fretIdx = note[1];
        let color = note[2] || "#A0522D";
        let finger = note[3] || "";
        
        let cy = cfg.startY + (stringIdx * cfg.stringGap);
        let cx = (fretIdx === 0) 
                 ? cfg.startX - 20 
                 : cfg.startX + (fretIdx * cfg.fretWidth) - (cfg.fretWidth / 2);
        
        // Krúžok tónu
        svg += `<circle cx="${cx}" cy="${cy}" r="${cfg.dotRadius}" fill="${color}" stroke="#000" stroke-width="1.5" />`;
        
        // Číslo prsta
        if (finger !== "") {
            svg += `<text x="${cx}" y="${cy}" fill="white" font-size="13" font-family="Arial" text-anchor="middle" dominant-baseline="central" font-weight="bold">${finger}</text>`;
        }
    });

    svg += `</svg>`;
    fretboard.innerHTML = svg;
}

const data = {
    'E_DUR': [
        [6, 0, 'red', '0'], [5, 2, '', '2'], [6, 2, '', '2'], [6, 4, '', '4'],[5, 0, '', '0'],[5, 2, '', '2'],[5, 4, '', '4'],[4, 1, '', '1'],[4, 2, 'red', '2'], 
        [4, 4, '', '4'],[3, 1, '', '1'], [3, 2, '', '2'], [2, 0, '', '0'], [2, 2, '', '2'], [2, 4, '', '4'],[1, 0, 'red', '0']
    ],
    'C_DUR_AKORD': [
        [5, 3, '#4B3621', '3'], [4, 2, '#4B3621', '2'], [3, 0, '#8B0000', ''], 
        [2, 1, '#4B3621', '1'], [1, 0, '#8B0000', '']
    ]
};

function drawScale(name) {
    renderGuitar(data[name]);
}

// Spustíme úvodné vykreslenie
renderGuitar(data['E_DUR']);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervaly</title>
</head>
<body>
   <div class="interval-section">
    <h3>Učenie intervalov</h3>
    <select id="intervalPicker" onchange="updateIntervalView()">
        <option value="">-- Vyberte interval --</option>
    </select>
    
    <div style="display: flex; gap: 30px; margin-top: 20px;">
        <!-- Kontajner pre vertikálny klavír -->
        <div id="pianoContainer"></div>
        
        <!-- Textový popis -->
        <div id="intervalDescBox" style="padding: 15px; background: #fff; border-left: 5px solid red; height: fit-content;">
            <h4 id="intTitle">Vyberte interval</h4>
            <p id="intText"></p>
        </div>
    </div>
</div>
<script>
    let intervalData = [];

async function loadIntervals() {
    try {
        const response = await fetch('intervaly.json');
        const data = await response.json();
        intervalData = data.intervals;

        const picker = document.getElementById('intervalPicker');
        intervalData.forEach((item, index) => {
            let option = document.createElement('option');
            option.value = index;
            option.innerText = item.name;
            picker.appendChild(option);
        });
    } catch (e) { console.error("Chyba načítania intervalov", e); }
}

function updateIntervalView() {
    const idx = document.getElementById('intervalPicker').value;
    if (idx === "") return;

    const interval = intervalData[idx];
    document.getElementById('intTitle').innerText = interval.name;
    document.getElementById('intText').innerHTML = interval.desc + `<br><strong>Poltóny:</strong> ${interval.semitones}`;

    // Vykreslíme klavír a pošleme mu tóny na zvýraznenie
    renderVerticalPiano(interval.pianoNotes);
}

function renderVerticalPiano(highlightNotes = []) {
    const container = document.getElementById('pianoContainer');
    const whiteWidth = 120;
    const whiteHeight = 40;
    const blackWidth = 85; // Mierne širšie pre text "D#/Eb"
    const blackHeight = 24;

    const keys = [
         { white: 'H1', black: null },
        { white: 'A1', black: ['A#1', 'Bb1'] },
        { white: 'G1', black: ['G#1', 'Ab1'] },
        { white: 'F1', black: ['F#1', 'Gb1'] },
        { white: 'E1', black: null },
        { white: 'D1', black: ['D#1', 'Eb1'] },
        { white: 'C1', black: ['C#1', 'Db'] },
        { white: 'H', black: null },
        { white: 'A', black: ['A#', 'Bb'] },
        { white: 'G', black: ['G#', 'Ab'] },
        { white: 'F', black: ['F#', 'Gb'] },
        { white: 'E', black: null },
        { white: 'D', black: ['D#', 'Eb'] },
        { white: 'C', black: ['C#', 'Db'] },
           ];

    let svg = `<svg width="${whiteWidth + 30}" height="${keys.length * whiteHeight*2}" viewBox="0 0 ${whiteWidth + 30} ${keys.length * whiteHeight*2}">`;

    // 1. Biele klávesy (bezo zmeny)
    keys.forEach((key, i) => {
        let y = i * whiteHeight;
        let fill = highlightNotes.includes(key.white) ? "#FF4136" : "white";
        svg += `<rect x="0" y="${y}" width="${whiteWidth}" height="${whiteHeight}" fill="${fill}" stroke="#333" />`;
        svg += `<text x="${whiteWidth - 20}" y="${y + whiteHeight/2}" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="${fill === 'white' ? '#333' : 'white'}" dominant-baseline="central">${key.white}</text>`;
    });

    // 2. Čierne klávesy - UPRAVENÉ PRE ENHARMONIKU
    keys.forEach((key, i) => {
        if (key.black) {
            let y = (i * whiteHeight) - (blackHeight / 2);
            if (y < 0) return;

            // Kontrola, či je v highlightNotes aspoň jeden z aliasov (D# alebo Eb)
            const activeAlias = key.black.find(name => highlightNotes.includes(name));
            const isHighlighted = !!activeAlias;
            const fill = isHighlighted ? "#FF4136" : "black";

            // Zobrazíme buď konkrétny aktívny názov, alebo oba naraz
            const displayText = activeAlias ? activeAlias : key.black.join('/');

            svg += `<rect x="0" y="${y}" width="${blackWidth}" height="${blackHeight}" fill="${fill}" rx="2" />`;
            svg += `<text x="${blackWidth / 2}" y="${y + blackHeight/2}" text-anchor="middle" font-family="Arial" font-size="11" fill="white" dominant-baseline="central">${displayText}</text>`;
        }
    });

    svg += `</svg>`;
    container.innerHTML = svg;
}

// Inicializácia
loadIntervals();
renderVerticalPiano(); // Prázdny klavír na začiatku

  
</script>
</body>
</html>
